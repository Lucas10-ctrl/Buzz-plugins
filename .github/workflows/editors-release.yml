# Build the editor plugins' runtime for every platform, publish it as a GitHub
# Release, then point the plugin manifests (docs, canvas, page-builder,
# all-editors) at that release. Run it from Actions → Editors release.
name: Editors release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example editors-v1
        required: true

permissions:
  contents: write

concurrency:
  group: editors-release
  cancel-in-progress: false

env:
  NODE_VERSION: 24.18.0
  PNPM_VERSION: 11.8.0
  BUZZ_CARGO: cargo

jobs:
  build:
    name: Runtime ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, platform: linux-x64, ui: true }
          - { os: macos-15, platform: darwin-arm64 }
          - { os: macos-15-intel, platform: darwin-x64 }
          - { os: windows-2022, platform: win32-x64 }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugins

      - name: Check tag
        env:
          TAG: ${{ inputs.tag }}
        run: '[[ "$TAG" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "Invalid tag: $TAG"; exit 1; }'

      - name: Restore editor source
        run: |
          git config --global core.autocrlf false
          git config --global core.symlinks true
          bash plugins/buzz-editors/restore.sh src

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Rust toolchain
        working-directory: src
        run: rustup show active-toolchain || rustup toolchain install

      - name: Install dependencies
        working-directory: src
        run: pnpm install --frozen-lockfile

      - name: Build editor worker
        working-directory: src
        run: pnpm editors:build

      - name: Build runtime
        working-directory: src
        run: node plugin-package/build.mjs runtime ../out

      - name: Build editor UI
        if: matrix.ui
        working-directory: src
        run: node plugin-package/build.mjs ui ../out

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: plugins

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: out
          merge-multiple: true

      - name: Checksums
        working-directory: out
        run: |
          sha256sum ui-*.mjs.gz runtime-*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Restore editor source
        run: bash plugins/buzz-editors/restore.sh src

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Write plugin manifests
        env:
          TAG: ${{ inputs.tag }}
        run: node src/plugin-package/build.mjs plugins plugins --tag "$TAG" --sums out/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Editors $TAG" \
            --notes "Runtime and editor UI for the Docs, Canvas, Page Builder and All Editors plugins. Buzz downloads these automatically the first time a plugin opens; you don't need to download anything here."

      - name: Commit manifests
        working-directory: plugins
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs canvas page-builder all-editors
          git commit -m "Point editor plugins at release $TAG"
          git pull --rebase origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
