[package]
name = "buzz-editor-credentials"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.89"

[features]
packaged-plugin = []

[dependencies]
buzz-credential-store = { path = "../credential-store" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1.9"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }
